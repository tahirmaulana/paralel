# @file workers/keeper/wrangler.toml — Cloudflare Worker config for the keeper
name = "paralel-keeper"
main = "src/index.ts"
compatibility_date = "2024-03-20"

[vars]
AUCTION_CONTRACT_ADDRESS = "0x80db02BfB4d0163a2dbd7f096178BF7AE5A66d2c"
MAX_ACTIONS_PER_RUN = "5"
MAX_CANDIDATES = "25"

[[secrets_store_secrets]]
binding = "ARBITRUM_RPC_URL"
store_id = "6ed82faf2c474a5fa75a594d362c750f"
secret_name = "ARBITRUM_RPC_URL"

[[secrets_store_secrets]]
binding = "DATABASE_URL"
store_id = "6ed82faf2c474a5fa75a594d362c750f"
secret_name = "DATABASE_URL"

[triggers]
crons = ["* * * * *"]