# @file workers/keeper/wrangler.toml
# Cloudflare Worker configuration for the PARALEL keeper.

name = "paralel-keeper"
main = "src/index.ts"
compatibility_date = "2026-11-04"

[vars]
MAX_ACTIONS_PER_RUN = "5"
MAX_CANDIDATES = "10"

[[secrets_store_secrets]]
binding = "ARBITRUM_RPC_URL"
store_id = "6ed82faf2c474a5fa75a594d362c750f"
secret_name = "ARBITRUM_RPC_URL"

[[secrets_store_secrets]]
binding = "DATABASE_URL"
store_id = "6ed82faf2c474a5fa75a594d362c750f"
secret_name = "DATABASE_URL"

[[secrets_store_secrets]]
binding = "RELAYER_PRIVATE_KEY"
store_id = "6ed82faf2c474a5fa75a594d362c750f"
secret_name = "RELAYER_PRIVATE_KEY"

[triggers]
crons = ["* * * * *"]
