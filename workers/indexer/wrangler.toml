# @file workers/indexer/wrangler.toml
# Cloudflare Worker configuration for the PARALEL indexer.

name = "paralel-indexer"
main = "src/index.ts"
compatibility_date = "2026-11-04"

[vars]
MAX_BLOCK_RANGE = "500"

[[secrets_store_secrets]]
binding = "ARBITRUM_RPC_URL"
store_id = "6ed82faf2c474a5fa75a594d362c750f"
secret_name = "ARBITRUM_RPC_URL"

[[secrets_store_secrets]]
binding = "DATABASE_URL"
store_id = "6ed82faf2c474a5fa75a594d362c750f"
secret_name = "DATABASE_URL"

[triggers]
crons = ["* * * * *"]
